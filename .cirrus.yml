build_rom_task:
  name: "Build Project Monarch (onyx) ROM"
  timeout_in: 240m
  container:
    image: aospstudio/docker-aosp:latest
    cpu: 8
    memory: 32G
    disk: 300
  environment:
    CIRRUS_CLONE_DEPTH: 1
    USE_CCACHE: 1
    CCACHE_DIR: "/tmp/ccache"
    CCACHE_SIZE: "20G"
    CCACHE_COMPRESS: 1
  build_script:
    - git init /tmp/monarch-onyx-audit
    - git -C /tmp/monarch-onyx-audit remote add origin https://github.com/xiaomi-onyx-dev/android_device_xiaomi_onyx.git
    - git -C /tmp/monarch-onyx-audit fetch --depth=1 origin 37ac86fe1cb218ed2198ad5c7f501106b17fb773
    - git -C /tmp/monarch-onyx-audit checkout --detach FETCH_HEAD
    - python3 scripts/audit_rom.py --device /tmp/monarch-onyx-audit --require-ready
    - mkdir -p /tmp/ccache
    - git config --global user.name "ROHITSHARMA838888"
    - git config --global user.email "rohitsharma838888@users.noreply.github.com"
    - mkdir -p /root/bin /root/monarch
    - curl https://storage.googleapis.com/git-repo-downloads/repo > /root/bin/repo
    - chmod a+x /root/bin/repo
    - export PATH="/root/bin:$PATH"
    - cd /root/monarch
    - repo init -u https://android.googlesource.com/platform/manifest -b android-latest-release --depth=1
    - mkdir -p .repo/local_manifests
    - cp $CIRRUS_WORKING_DIR/local_manifests/roomservice.xml .repo/local_manifests/
    - repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --current-branch
    - source build/envsetup.sh
    - lunch aosp_onyx-userdebug
    - m -j8 target-files-package otapackage
  rom_artifacts:
    path: "/root/monarch/out/target/product/onyx/*.zip"
