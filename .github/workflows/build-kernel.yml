name: ⚡ Poco F7 (onyx) Kernel & Boot Image Build

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'ksu-next'
        type: choice
        options:
          - ksu-next (KernelSU-Next + SuSFS)
          - vanilla (Stock Kernel)
      compiler:
        description: 'Clang Compiler'
        required: true
        default: 'azure-clang'
        type: choice
        options:
          - azure-clang
          - aosp-clang

jobs:
  build-kernel:
    name: Build Poco F7 KernelSU-Next
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space & Setup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg libelf-dev \
            libssl-dev lz4 make python3 rsync zip zlib1g-dev ccache libncurses-dev

      - name: Setup Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          echo "Downloading Azure Clang..."
          curl -LO "https://gitlab.com/dakkshesh07/quantum-clang/-/archive/master/quantum-clang-master.tar.gz" || \
          curl -LO "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          mkdir -p clang-toolchain
          tar -xf *.tar.* -C clang-toolchain --strip-components=1 || true
          echo "$GITHUB_WORKSPACE/clang/clang-toolchain/bin" >> $GITHUB_PATH

      - name: Clone Poco F7 Kernel Source
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel
          cd $GITHUB_WORKSPACE/kernel
          echo "Cloning Poco F7 (sm8735) Kernel Tree..."
          git clone --depth=1 https://github.com/xiaomi-onyx-dev/android_kernel_xiaomi_sm8735 -b seventeen sm8735 || \
          git clone --depth=1 https://github.com/xiaomi-onyx-dev/android_kernel_xiaomi_sm8735 -b lineage-24.0 sm8735

      - name: Integrate KernelSU-Next & SuSFS
        if: ${{ inputs.ksu_variant == 'ksu-next (KernelSU-Next + SuSFS)' }}
        run: |
          cd $GITHUB_WORKSPACE/kernel/sm8735
          echo "Setting up KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig || true

      - name: Setup AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          sed -i 's/device.name1=.*/device.name1=onyx/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=Poco F7/g' AnyKernel3/anykernel.sh

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel/sm8735
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/clang-toolchain/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          echo "Configuring Kernel..."
          make O=out ARCH=arm64 gki_defconfig || make O=out ARCH=arm64 vendor/onyx_defconfig || true
          
          echo "Building Kernel Image..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1 Image.lz4 Image || true

      - name: Package Flashable Zip
        run: |
          cd $GITHUB_WORKSPACE
          cp kernel/sm8735/out/arch/arm64/boot/Image.lz4 AnyKernel3/ || \
          cp kernel/sm8735/out/arch/arm64/boot/Image AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 "../Monarch-KernelSU-Next-onyx-$(date +%Y%m%d).zip" * -x .git README.md *placeholder

      - name: Upload Kernel Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monarch-KernelSU-Next-PocoF7
          path: $GITHUB_WORKSPACE/*.zip
          retention-days: 14
