name: ⚡ Poco F7 (onyx) Kernel & Boot Image Build

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: 'KernelSU Variant'
        required: true
        default: 'ksu-next'
        type: choice
        options:
          - ksu-next (KernelSU-Next + SuSFS)
          - vanilla (Stock Kernel)

jobs:
  build-kernel:
    name: Build Poco F7 KernelSU-Next
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Maximize Disk Space & Setup Environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git gnupg libelf-dev \
            libssl-dev lz4 make python3 rsync zip zlib1g-dev ccache libncurses-dev \
            clang lld llvm gcc-aarch64-linux-gnu

      - name: Clone Poco F7 Kernel Source
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel
          cd $GITHUB_WORKSPACE/kernel
          echo "Cloning Poco F7 (sm8735) Kernel Tree (seventeen branch)..."
          git clone --depth=1 https://github.com/xiaomi-onyx-dev/android_kernel_xiaomi_sm8735 -b seventeen sm8735

      - name: Integrate KernelSU-Next & SuSFS
        if: ${{ inputs.ksu_variant == 'ksu-next (KernelSU-Next + SuSFS)' }}
        run: |
          cd $GITHUB_WORKSPACE/kernel/sm8735
          echo "Setting up KernelSU-Next..."
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s || true
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/gki_defconfig

      - name: Setup AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3
          sed -i 's/device.name1=.*/device.name1=onyx/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=Poco F7/g' AnyKernel3/anykernel.sh

      - name: Compile Kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel/sm8735
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "Generating defconfig with GKI + onyx_perf..."
          make O=out ARCH=arm64 CC=clang LLVM=1 gki_defconfig vendor/onyx_perf.config || \
          make O=out ARCH=arm64 CC=clang LLVM=1 gki_defconfig
          
          echo "Disabling module signing verification (prevent OpenSSL cert errors)..."
          ./scripts/config --file out/.config --set-str SYSTEM_TRUSTED_KEYS "" || true
          ./scripts/config --file out/.config --set-str SYSTEM_REVOCATION_KEYS "" || true
          ./scripts/config --file out/.config --disable MODULE_SIG_ALL || true
          ./scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYS || true
          ./scripts/config --file out/.config --disable SYSTEM_REVOCATION_KEYS || true
          
          echo "Building Kernel Image (Image & Image.lz4)..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1 Image Image.lz4 || make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 Image

      - name: Package Flashable Zip
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p output
          find kernel/sm8735/out/arch/arm64/boot/ -name "Image*" -exec cp {} AnyKernel3/ \;
          cd AnyKernel3
          ZIP_NAME="Monarch-KernelSU-Next-onyx-$(date +%Y%m%d%H%M).zip"
          zip -r9 "../$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP created: $ZIP_NAME"
          ls -la ../*.zip

      - name: Upload Kernel Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monarch-KernelSU-Next-PocoF7
          path: '*.zip'
          retention-days: 14
