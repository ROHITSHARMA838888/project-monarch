name: Review compiled module evidence (no rebuild)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fresh-kernel/required-runtime-modules.txt'
      - 'fresh-kernel/review_module_evidence.py'
      - '.github/workflows/review-module-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: corrected-onyx-kernel-build-evidence-not-rom
          run-id: 42393004392
          github-token: ${{ github.token }}
          path: previous
      - name: Check pinned runtime-list coverage and recorded releases
        run: python3 fresh-kernel/review_module_evidence.py previous fresh-kernel/required-runtime-modules.txt reviewed/result.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-kernel-module-evidence-not-rom
          path: reviewed/result.json
          if-no-files-found: error
