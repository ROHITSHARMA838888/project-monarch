name: 👑 Project Monarch CI Build

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant (user / userdebug)'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
      root_type:
        description: 'Root Engine'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla
      enable_ccache:
        description: 'Enable automated ccache for lightning-fast rebuilds'
        required: true
        default: true
        type: boolean
      swap_size_gb:
        description: 'Swap memory size in GB (prevents OOM crashes)'
        required: true
        default: '12'
        type: string
      clean_cache:
        description: 'Force purge existing compiler cache'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ROM for Poco F7 (onyx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Monarch
        uses: actions/checkout@v4

      - name: Check port readiness before downloading AOSP
        run: |
          set -euo pipefail
          git init /tmp/monarch-onyx-audit
          git -C /tmp/monarch-onyx-audit remote add origin https://github.com/xiaomi-onyx-dev/android_device_xiaomi_onyx.git
          git -C /tmp/monarch-onyx-audit fetch --depth=1 origin 37ac86fe1cb218ed2198ad5c7f501106b17fb773
          git -C /tmp/monarch-onyx-audit checkout --detach FETCH_HEAD
          python3 scripts/audit_rom.py --device /tmp/monarch-onyx-audit --require-ready

      - name: Maximize Disk Space & Purge Bloat
        run: |
          echo "Freeing disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          sudo apt-get clean
          df -h

      - name: Configure Virtual Swap Memory & OOM Protection
        env:
          REQUESTED_SWAP_GB: ${{ inputs.swap_size_gb }}
        run: |
          SWAP_GB="$REQUESTED_SWAP_GB"
          [[ "$SWAP_GB" =~ ^([1-9]|1[0-6])$ ]] || { echo "Swap must be 1-16 GiB"; exit 1; }
          echo "Setting up ${SWAP_GB}GB swap file to prevent memory exhaustion..."
          sudo swapoff -a || true
          sudo fallocate -l "${SWAP_GB}G" /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=$((SWAP_GB * 1024))
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "Memory and Swap Status:"
          free -h

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
            libncurses-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig ccache \
            python3 bc libssl-dev rsync jq libncurses6 libelf-dev libx11-dev

      - name: Automated ccache Restore
        if: ${{ inputs.enable_ccache && !inputs.clean_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: monarch-aosp-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            monarch-aosp-ccache-${{ runner.os }}-${{ github.ref_name }}-
            monarch-aosp-ccache-${{ runner.os }}-

      - name: Configure ccache & Memory Limits
        if: ${{ inputs.enable_ccache }}
        run: |
          mkdir -p ~/.ccache
          export USE_CCACHE=${{ inputs.enable_ccache && '1' || '0' }}
          export CCACHE_DIR=~/.ccache
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 9G
          ccache -o compression=true
          ccache -o compression_level=5
          if [ "${{ inputs.clean_cache }}" = "true" ]; then
            echo "Purging old ccache as requested..."
            ccache -C
          fi
          ccache -z
          echo "Initial ccache state:"
          ccache -s

      - name: Setup Build Environment Variables
        run: |
          # Set JVM memory limit to avoid killing Soong / Metalava
          echo "_JAVA_OPTIONS=-Xmx4g" >> $GITHUB_ENV
          # Limit Ninja parallel jobs according to memory constraints
          echo "NINJA_ARGS=-j4" >> $GITHUB_ENV
          # Optimize Kotlin daemon memory
          echo "GRADLE_OPTS=-Dorg.gradle.jvmargs=-Xmx2048m" >> $GITHUB_ENV

      - name: Setup Git Identity & Repo Tool
        run: |
          git config --global user.name "ROHITSHARMA838888"
          git config --global user.email "rohitsharma838888@users.noreply.github.com"
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Manifest & Sync Device Trees
        run: |
          mkdir -p ~/monarch
          cd ~/monarch
          repo init -u https://android.googlesource.com/platform/manifest -b android-latest-release --depth=1
          mkdir -p .repo/local_manifests
          if [ -f "$GITHUB_WORKSPACE/local_manifests/roomservice.xml" ]; then
            cp "$GITHUB_WORKSPACE/local_manifests/roomservice.xml" .repo/local_manifests/
          fi
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --current-branch

      - name: Verify Monarch product integration
        run: |
          test -f "$GITHUB_WORKSPACE/products/monarch.mk"

      - name: Build ROM (Memory-Optimized Incremental)
        run: |
          cd ~/monarch
          export USE_CCACHE=${{ inputs.enable_ccache && '1' || '0' }}
          export CCACHE_DIR=~/.ccache
          export CCACHE_EXEC=/usr/bin/ccache
          source build/envsetup.sh
          lunch aosp_onyx-${{ inputs.build_variant }}
          m -j4 target-files-package otapackage

      - name: Display Post-Build ccache Statistics
        if: ${{ inputs.enable_ccache }}
        run: |
          export CCACHE_DIR=~/.ccache
          echo "=== ccache efficiency & hit rate ==="
          ccache -s

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monarch-ROM-onyx-${{ inputs.build_variant }}-${{ inputs.root_type }}
          path: ~/monarch/out/target/product/onyx/*.zip
          if-no-files-found: error
