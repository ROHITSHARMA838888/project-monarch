name: 👑 Project Monarch CI Build

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build Variant (user / userdebug)'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user
      root_type:
        description: 'Root Engine'
        required: true
        default: 'vanilla'
        type: choice
        options:
          - vanilla (Non-Rooted)
          - ksu-next (KernelSU-Next + SuSFS)
          - magisk (Magisk Integrated)
      enable_ccache:
        description: 'Enable ccache for faster compilation'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build ROM for Poco F7 (onyx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project Monarch
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -a -f
          sudo apt-get clean
          df -h

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git gnupg flex bison build-essential zip curl zlib1g-dev \
            libncurses-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig ccache \
            python3 bc libssl-dev rsync jq libncurses6 libelf-dev libx11-dev

      - name: Setup Git Identity & Repo Tool
        run: |
          git config --global user.name "ROHITSHARMA838888"
          git config --global user.email "rohitsharma838888@users.noreply.github.com"
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize Manifest & Sync Device Trees
        run: |
          mkdir -p ~/monarch
          cd ~/monarch
          repo init -u https://android.googlesource.com/platform/manifest -b android-latest-release --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifests/roomservice.xml .repo/local_manifests/
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Setup ccache
        if: ${{ inputs.enable_ccache }}
        run: |
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 50G
          ccache -s

      - name: Setup KernelSU-Next & SuSFS
        if: ${{ inputs.root_type == 'ksu-next' }}
        run: |
          echo "Integrating KernelSU-Next (KernelSU-Next/KernelSU-Next) and SuSFS..."
          cd ~/monarch/kernel/xiaomi/sm8735
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          # Configure SuSFS stealth patch for banking security
          echo "CONFIG_KSU=y" >> arch/arm64/configs/*_defconfig || true
          echo "CONFIG_KSU_NEXT=y" >> arch/arm64/configs/*_defconfig || true

      - name: Apply Monarch AI & Spoofing Framework Patches
        run: |
          echo "Applying Project Monarch custom frameworks & Spoofing patches..."
          # Sync overlay configs and settings modifications

      - name: Build ROM
        run: |
          cd ~/monarch
          source build/envsetup.sh
          lunch aosp_onyx-${{ inputs.build_variant }}
          mka bacon -j$(nproc --all)

      - name: Upload Flashable ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monarch-ROM-onyx-${{ inputs.build_variant }}-${{ inputs.root_type }}
          path: ~/monarch/out/target/product/onyx/*.zip
